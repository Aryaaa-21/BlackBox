services:
  mongodb:
    image: mongo:7.0.14
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --host localhost:27017/admin --eval 'db.adminCommand({ ping: 1 }).ok' | grep 1"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - blackbox-prod-mongodb-data:/data/db
    networks: [blackbox]

  mongodb-init:
    image: mongo:7.0.14
    depends_on:
      mongodb:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        mongosh --quiet --host mongodb:27017/admin --eval
        'try { rs.status(); } catch (error) { rs.initiate({_id:"rs0",members:[{_id:0,host:"mongodb:27017"}]}); }'
    networks: [blackbox]

  backend:
    build:
      context: .
      dockerfile: Dockerfile.server
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGODB_URI: mongodb://mongodb:27017/blackbox?replicaSet=rs0
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET to a random value of at least 32 characters}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      CLIENT_URL: ${CLIENT_URL:-http://localhost:5173}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
      ALLOW_INSECURE_HTTP: ${ALLOW_INSECURE_HTTP:-true}
      ENABLE_DEMO_MODE: "false"
    depends_on:
      mongodb-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:5000/api/v1/health/ready >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 20
    ports:
      - "5000:5000"
    networks: [blackbox]

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.client
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:5000/api/v1}
        VITE_SOCKET_URL: ${VITE_SOCKET_URL:-http://localhost:5000}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/healthz >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "5173:80"
    networks: [blackbox]

networks:
  blackbox:
    driver: bridge

volumes:
  blackbox-prod-mongodb-data:
