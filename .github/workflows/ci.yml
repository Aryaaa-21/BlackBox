name: BlackBox CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Client typecheck
        run: npm run typecheck:client

      - name: Client lint
        run: npm run lint --prefix client

      - name: Server lint/typecheck
        run: npm run lint

      - name: Client tests
        run: npm test --prefix client

      - name: Server tests
        run: npm test --prefix server

      - name: Client production build
        run: npm run build:client

      - name: Server production build
        run: npm run build:server

      - name: Dependency audit
        run: npm audit --omit=dev

      - name: Chromium smoke and acceptance
        run: npm run test:e2e --prefix client
